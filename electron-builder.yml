# Empaquetado de DotForge IDE.
#
# Windows: instalador NSIS (.exe) + portable (.zip)
# macOS:   imagen de disco (.dmg) + .app comprimido (.zip), en arm64 y x64
#
# Decisiones:
#  - `asar: true` con `asarUnpack` para Monaco: el loader AMD y sus web workers funcionan mucho
#    mejor sobre archivos reales que dentro del archivo empaquetado.
#  - Las plantillas de scaffolding van a `resources/templates`, fuera del asar, porque el
#    generador las lee con `fs` desde `process.resourcesPath`.
#  - `node-pty` es la única dependencia nativa, y es opcional (ADR-059). No hace falta compilarlo:
#    publica los binarios ya compilados dentro del paquete y son Node-API, que es ABI estable, así
#    que valen para Electron sin recompilar. Va fuera del asar porque un `.node` no se puede cargar
#    desde dentro del archivo empaquetado.
#  - `npmRebuild: false` porque electron-builder **no mira si el módulo trae binarios**: ve una
#    dependencia nativa y lanza `@electron/rebuild`, que llama a node-gyp y exige Visual Studio.
#    Sin él, el empaquetado muere con "Could not find any Visual Studio installation to use" aunque
#    el `.node` que se va a distribuir ya esté ahí, compilado y funcionando.

appId: dev.dotforge.ide
productName: DotForge IDE
copyright: Copyright © 2026 DotForge

directories:
  output: dist
  buildResources: resources

files:
  - build/**/*
  - '!build/templates/**'
  - '!**/*.map'
  - package.json
  # La única dependencia de runtime que no está bundleada: es nativa y se carga con `require`.
  - node_modules/node-pty/**/*

extraResources:
  - from: build/templates
    to: templates
    filter:
      - '**/*'

# No se recompila ninguna dependencia nativa al empaquetar: la única que hay trae sus binarios
# hechos y son ABI estable. Ver la nota de la cabecera y el ADR-059.
npmRebuild: false

asar: true
asarUnpack:
  - build/vendor/**
  # Un binario nativo no se puede cargar desde dentro del asar: Node necesita una ruta real.
  - node_modules/node-pty/**

# Sin publicador: los artefactos se generan en local y no se suben a ningún sitio.
publish: null

# ---------------------------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------------------------
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  signAndEditExecutable: true

  # Firma Authenticode.
  #
  # No hay certificado todavía, así que hoy todo sale sin firmar y el instalador avisa con
  # SmartScreen. Estas opciones son inertes mientras no lo haya: electron-builder sólo firma cuando
  # resuelve un certificado, y aquí no se declara ninguno a propósito.
  #
  # **El certificado nunca se escribe en este archivo ni se mete en el repositorio.** Llega por
  # entorno, que es como electron-builder espera recibirlo y lo único compatible con guardarlo en
  # un secret de GitHub:
  #
  #   CSC_LINK           el .pfx en base64 (o una ruta local, para firmar desde tu equipo)
  #   CSC_KEY_PASSWORD   su contraseña
  #
  # Con las dos vacías —lo que pasa hoy en la CI, porque los secrets no existen— electron-builder
  # ve `cscLink === ""`, no busca más y empaqueta sin firmar. Es decir: esto ya está enchufado y no
  # cambia nada hasta el día que se cree el secret. Ver el job `build-windows` del workflow.
  #
  # El día que haya certificado, además de crear los dos secrets hay que comprobar una cosa: que
  # `verify-dist.mjs --require-signed` pasa. Sin esa comprobación, un `.pfx` caducado o una
  # contraseña mal copiada publican un binario sin firmar con toda la CI en verde.
  signtoolOptions:
    # SHA-1 está muerto para Authenticode desde 2016: firmar también con él no da compatibilidad,
    # da una segunda firma que ningún Windows soportado valida.
    signingHashAlgorithms:
      - sha256
    # Sellado de tiempo RFC 3161, y no es opcional: sin él la firma deja de valer el día que caduca
    # el certificado, en vez de seguir valiendo para lo que se firmó mientras estaba vigente.
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DotForge IDE
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

# ---------------------------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------------------------
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  # Hardened runtime desactivado porque no hay certificado con el que firmar: activarlo sin
  # firma produce una app que macOS rechaza sin explicación útil.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 DotForge
    CFBundleDocumentTypes:
      - CFBundleTypeName: Solución de .NET
        CFBundleTypeRole: Editor
        LSItemContentTypes:
          - public.data
        CFBundleTypeExtensions:
          - sln
          - slnx
          - csproj

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------------------------------------------------------------------------
# Linux (no es un objetivo del producto, pero sale gratis y facilita el desarrollo)
# ---------------------------------------------------------------------------------------------
linux:
  icon: resources/icons
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
