# Compilación y empaquetado de DotForge IDE para Windows y macOS.
#
# El .dmg y el .app se generan en un runner macOS porque electron-builder no puede producirlos
# desde otra plataforma. Este workflow es la ruta oficial para obtener los artefactos de macOS.

# --- MACOS-DESACTIVADO ------------------------------------------------------------------------
#
# macOS está desactivado a propósito, no por descuido. No hay ningún Mac donde reproducir lo que
# falla, y arreglar a ciegas ya salió caro: la iteración 22 dio por buena una explicación —"caché
# de NuGet a medias"— que la 24 desmintió, porque volvió a fallar con la caché sin restaurar.
#
# Lo que NO se cubre mientras esté así:
#   - No se prueba nada en macOS.
#   - No se generan `.dmg` ni `.app`. Este runner es la única vía: electron-builder desde Windows
#     los empaqueta pero no puede firmarlos.
#
# Para reactivarlo, con un Mac delante:
#   1. Descomentar `macos-latest` en la matriz del job `test`.
#   2. Descomentar el job `build-macos` entero, al final de este archivo.
#   3. Actualizar `flujo de macOS` en tests/package/packaging.test.mjs, que hoy vigila justo lo
#      contrario: que sigue desactivado y que la receta comentada no se ha perdido.
#   4. Queda pendiente de diagnosticar el fallo que motivó esto: `runtime-smoke` moría con
#      `Could not load file or assembly 'Microsoft.EntityFrameworkCore, Version=10.0.11.0'`,
#      es decir, la app compilaba y arrancaba pero el DLL no estaba en el directorio de salida.
# ------------------------------------------------------------------------------------------------

name: release

# Tres formas de llegar aquí, y las tres acaban en el mismo sitio: una release publicada con sus
# artefactos colgando. Es lo que el actualizador in-app lee al arrancar (`UPDATE_FEED`), así que
# una versión que no pasa por aquí no existe para nadie que ya tenga el IDE instalado.
#
#   - `push` de un tag `v*`     -> el camino normal: se etiqueta y se publica solo.
#   - `workflow_dispatch`       -> a mano, indicando el tag; si no existe, se crea sobre el commit.
#   - `release: published`      -> alguien la creó desde la web y aquí se le adjuntan los binarios.
#
# El tercero no se muerde la cola: una release creada por este workflow con el `GITHUB_TOKEN` por
# defecto **no** dispara nuevos workflows. Es una garantía de GitHub, no una casualidad, pero
# conviene saberla antes de cambiar el token por uno personal.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag SemVer a publicar (por defecto, la versión de package.json)'
        required: false
        type: string
      draft:
        description: 'Publicar como borrador (no lo ve el actualizador in-app)'
        required: false
        default: false
        type: boolean

# Mínimo por defecto: sólo el job que publica sube el permiso de escritura que necesita.
permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # MACOS-DESACTIVADO: la línea buena es la de abajo; descomentarla y borrar esta.
        os: [windows-latest]
        # os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # El primer `dotnet build` de cada plantilla restaura paquetes; cachearlos ahorra minutos.
      #
      # La clave lleva `v2` desde el hotfix de la v2.1.0: una caché anterior dejó a macOS con un
      # `Microsoft.EntityFrameworkCore` que el build daba por restaurado y el runtime no encontraba,
      # y la Web API generada moría al arrancar. Subir la versión de la clave descarta esa caché
      # entera en vez de arrastrar el problema. Sin `restore-keys`, a propósito: recuperar una
      # caché anterior es justamente lo que hay que evitar.
      - name: Cachear paquetes NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-v2-${{ hashFiles('src/scaffold/context.ts') }}

      - run: npm ci

      # electron 43 ya no trae script de instalación —el binario se baja con su propio bin— y npm 11
      # además bloquea los scripts de instalación pendientes de aprobación. Sin este paso,
      # `node_modules/electron/dist` no existe y la prueba de humo de la aplicación no puede
      # arrancar nada. Es idempotente: sale con 0 si el binario ya está.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - run: npm run build
      - run: npx tsc --noEmit

      # El token evita el 403 por límite de peticiones de la API de GitHub, que sin autenticar es de
      # 60 por hora **y por IP**: la de un runner compartido está agotada casi siempre, y la
      # adquisición de NetCoreDbg y de OmniSharp se queda sin poder resolver su release. Sólo viaja
      # a `api.github.com`; lo vigila `tests/unit/github-api.test.mjs`.
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Artefactos de Windows
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - run: npm run icons
      - run: npm run dist:win
      - run: node scripts/verify-dist.mjs --require win

      - uses: actions/upload-artifact@v7
        with:
          name: dotforge-ide-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # La release publicada es el combustible del actualizador in-app. Hasta la v2.5.0 este workflow
  # construía los artefactos y los dejaba como "artifacts" del run, que caducan a los 90 días y no
  # se ven desde fuera: el feed `/repos/sfedev/IDE-DOTNET/releases` respondía 200 con cero
  # elementos y `update:check` decía "estás en la última versión" para siempre.
  #
  # Se usa la CLI `gh`, que viene instalada en los runners, y no una acción de terceros: publicar
  # es la operación con más permisos de todo el repositorio, y no merece un `uses:` ajeno que
  # además hay que fijar por SHA para que signifique algo.
  publish:
    name: Publicar la release
    needs: [test, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Historial completo: las notas se componen del rango entre el tag anterior y éste, y un
      # checkout superficial deja `git log` sin nada que contar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # El tag llega por tres sitios distintos según qué haya disparado el workflow. Va por `env`
      # y no interpolado dentro del script: un nombre de referencia acaba dentro de un shell, y ahí
      # las comillas son lo único que separa un dato de un comando.
      - name: Resolver el tag que se publica
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            push)    tag="$PUSHED_TAG" ;;
            release) tag="$RELEASE_TAG" ;;
            *)       tag="$INPUT_TAG" ;;
          esac

          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
            echo "Sin tag indicado: se usa la versión de package.json ($tag)."
          fi

          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$tag\" no es un tag SemVer. Se esperaba algo como v2.5.0."
            exit 1
          fi

          # Un prelanzamiento se marca como tal en GitHub porque el modelo del actualizador ya lo
          # trata así (`parseReleaseFeed`): sin la marca, una `2.6.0-rc.1` se ofrecería como
          # versión estable a todo el mundo.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # El artefacto lleva la versión incrustada en el nombre (`DotForge IDE-2.5.0-Setup-x64.exe`),
      # y quien decide si hay actualización es el **tag**. Si no coinciden, el IDE ofrece la 2.6.0,
      # instala un binario 2.5.0 y en el siguiente arranque la instalación pendiente sigue siendo
      # "más nueva" que la que corre: se reinstala en cada cierre, para siempre. Se corta aquí.
      - name: El tag y package.json tienen que decir la misma versión
        shell: bash
        env:
          TAG_VERSION: ${{ steps.target.outputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$TAG_VERSION" ]; then
            echo "::error::el tag dice $TAG_VERSION y package.json dice $package_version."
            echo "Los artefactos se nombran con la versión de package.json: publicar así deja al"
            echo "actualizador reinstalando la misma versión en cada cierre. Sube la versión primero."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: dotforge-ide-windows
          path: dist

      # MACOS-DESACTIVADO: cuando vuelva el job de macOS, sus artefactos se recogen aquí.
      # - uses: actions/download-artifact@v8
      #   with:
      #     name: dotforge-ide-macos
      #     path: dist

      - name: Componer las notas de la versión
        shell: bash
        run: node scripts/release-notes.mjs --tag "${{ steps.target.outputs.tag }}" --artifacts dist --output release-notes.md

      # Crear o completar, en ese orden. Los tres disparos convergen aquí: con `release: published`
      # la publicación ya existe y lo único que falta son los binarios, y con un tag empujado no
      # existe nada todavía. `--clobber` hace el paso idempotente: relanzar el workflow reemplaza
      # los artefactos en vez de fallar por duplicado.
      - name: Publicar la release y adjuntar los artefactos
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          IS_PRERELEASE: ${{ steps.target.outputs.prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          [ "$IS_PRERELEASE" = "true" ] && flags+=(--prerelease)
          [ "$IS_DRAFT" = "true" ] && flags+=(--draft)

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG ya existe: se actualizan sus notas y sus artefactos."
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "DotForge IDE $TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              "${flags[@]}"
          fi

          shopt -s nullglob
          assets=(dist/*.exe dist/*.zip dist/*.dmg)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no hay ningún artefacto que adjuntar en dist/."
            exit 1
          fi

          printf 'Adjuntando %d artefactos:\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber

      # Publicar no es lo mismo que estar publicado. Lo que de verdad importa es que el feed que
      # consulta el IDE —la API pública, sin autenticar y sin más filtro que el que aplica
      # `parseReleaseFeed`— devuelva esta versión con al menos un artefacto colgando. Un borrador
      # no aparece ahí, y decirlo aquí evita buscar el fallo en el cliente.
      - name: Comprobar que el actualizador in-app la ve
        if: ${{ inputs.draft != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft == false)] | length")"
          if [ "$published" != "1" ]; then
            echo "::error::el feed público no devuelve $TAG como release publicada."
            exit 1
          fi

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets | length')"
          if [ "$assets" -lt 1 ]; then
            echo "::error::$TAG está publicada pero sin artefactos: el IDE la ofrecería sin poder descargarla."
            exit 1
          fi

          echo "Feed correcto: $TAG publicada con $assets artefactos."

  # MACOS-DESACTIVADO: job `build-macos` comentado entero. Es la única fuente de `.dmg`/`.app`,
  # así que descomentarlo es exactamente lo que hay que hacer al recuperar un Mac. No se borra
  # para que la receta —iconos, dist:mac, verify --require mac, subida de artefactos— no se
  # tenga que reinventar.
